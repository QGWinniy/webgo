<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Корзина</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<div class="modal fade" id="checkoutModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <form action="/checkout" method="POST">

                <div class="modal-header">
                    <h5 class="modal-title">
                        Оформление заказа
                    </h5>
                </div>

                <div class="modal-body">

                    <div class="mb-3">
                        <label class="form-label">
                            Имя
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Телефон
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            required>
                    </div>

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        Отмена
                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary">
                        Отправить заказ
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<body class="bg-light">

<div class="container py-5">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fw-bold">🛒 Корзина</h1>

        <a href="/" class="btn btn-outline-primary">
            ← Назад к товарам
        </a>
    </div>

    <!-- empty state -->
    {{if not .}}
        <div class="alert alert-info">
            Корзина пустая 😐
        </div>
    {{end}}

    <!-- items -->
    <div class="row g-3">

        {{range .}}
        <div class="col-12">

            <div class="card shadow-sm border-0">
                <div class="row g-0 align-items-center">

                    <!-- image -->
                    <div class="col-md-3">
                        <img src="{{index .Product.Images 0}}"
                            class="img-fluid rounded-start"
                            style="height: 140px; object-fit: cover;">
                    </div>

                    <!-- info -->
                    <div class="col-md-6">
                        <div class="card-body">

                            <h5 class="card-title mb-1">{{.Product.Name}}</h5>

                            <p class="text-muted mb-2">
                                {{.Product.Description}}
                            </p>

                            <span class="badge bg-success fs-6">
                                {{.Product.Price}} ₽
                            </span>

                            <div class="mt-2">
                                <strong>Количество:</strong> {{.Qty}}
                            </div>

                            <div>
                                <strong>Сумма:</strong> {{.Sum}} ₽
                            </div>

                        </div>
                    </div>

                    <!-- actions -->
                    <div class="col-md-3 text-end pe-3">

                        <!-- - -->
                        <form action="/cart/remove" method="POST" class="d-inline">
                            <input type="hidden" name="id" value="{{.Product.ID}}">
                            <input type="hidden" name="return" value="/cart">
                            <button class="btn btn-outline-danger">
                                -
                            </button>
                        </form>

                        <!-- + -->
                        <form action="/cart/add" method="POST" class="d-inline">
                            <input type="hidden" name="id" value="{{.Product.ID}}">
                            <input type="hidden" name="qty" value="1">
                            <input type="hidden" name="return" value="/cart">
                            <button class="btn btn-success">
                                +
                            </button>
                        </form>

                    </div>

                </div>
            </div>

        </div>
        {{end}}

    </div>

    <!-- checkout -->
    {{if .}}
    <div class="mt-4 p-4 bg-white rounded shadow-sm">

        <div class="d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Итого</h4>
                
            <button
                class="btn btn-primary btn-lg"
                data-bs-toggle="modal"
                data-bs-target="#checkoutModal">
                Оформить заказ
            </button>
        </div>

    </div>
    {{end}}

</div>

</body>
</html>
