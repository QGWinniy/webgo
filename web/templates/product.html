{{define "product.html"}}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{.Product.Name}}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f6fa;
        }

        .product-image{
            width:100%;
            aspect-ratio:1/1;
            object-fit:cover;
            border-radius:20px;
        }

        .carousel-inner{
            border-radius:20px;
        }

        .price{
            font-size:2rem;
            font-weight:bold;
            color:#0d6efd;
        }

        .product-box{
            background:#fff;
            border-radius:20px;
            padding:30px;
            box-shadow:0 10px 30px rgba(0,0,0,.08);
        }

        .description{
            white-space:normal;
            line-height:1.7;
            color:#555;
        }

        .qty{
            font-size:22px;
            font-weight:bold;
            width:70px;
            text-align:center;
        }

        .btn-circle{
            width:45px;
            height:45px;
            border-radius:50%;
            font-size:22px;
        }
    </style>
</head>
<body>

<div class="container py-5">

<div class="row g-5">

<div class="col-lg-6">

<div id="carouselProduct" class="carousel slide">

<div class="carousel-inner">

{{range $i,$img:=.Product.Images}}

<div class="carousel-item {{if eq $i 0}}active{{end}}">
<img src="{{$img}}" class="product-image">
</div>

{{end}}

</div>

{{if gt (len .Product.Images) 1}}

<button class="carousel-control-prev" type="button" data-bs-target="#carouselProduct" data-bs-slide="prev">
<span class="carousel-control-prev-icon"></span>
</button>

<button class="carousel-control-next" type="button" data-bs-target="#carouselProduct" data-bs-slide="next">
<span class="carousel-control-next-icon"></span>
</button>

{{end}}

</div>

</div>

<div class="col-lg-6">

<div class="product-box h-100 d-flex flex-column">

<h1 class="fw-bold mb-3">{{.Product.Name}}</h1>

<div class="description mb-4">
{{nl2br .Product.Description}}
</div>

<div class="price mb-4">
{{.Product.Price}} ₽
</div>

{{if eq .Count 0}}

<form action="/cart/add" method="POST">

<input type="hidden" name="id" value="{{.Product.ID}}">
<input type="hidden" name="qty" value="1">
<input type="hidden" name="return" value="/product/{{.Product.ID}}">

<button class="btn btn-primary btn-lg">
Добавить в корзину
</button>

</form>

{{else}}

<div class="d-flex align-items-center gap-3">

<form action="/cart/remove" method="POST">

<input type="hidden" name="id" value="{{.Product.ID}}">
<input type="hidden" name="return" value="/product/{{.Product.ID}}">

<button class="btn btn-danger btn-circle">
−
</button>

</form>

<div class="qty">
{{.Count}}
</div>

<form action="/cart/add" method="POST">

<input type="hidden" name="id" value="{{.Product.ID}}">
<input type="hidden" name="qty" value="1">
<input type="hidden" name="return" value="/product/{{.Product.ID}}">

<button class="btn btn-success btn-circle">
+
</button>

</form>

</div>

{{end}}

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
{{end}}
