<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #364fc7 0%, #4c6ef5 45%, #4c6ef5 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .navbar-shop {
            background: transparent;
        }

        .navbar-shop .navbar-brand {
            color: #ffffff;
            font-weight: 700;
            letter-spacing: .3px;
        }

        .btn-pill-light {
            background: #ffffff;
            color: #364fc7;
            border-radius: 40px;
            font-weight: 600;
            border: none;
            padding: .5rem 1.1rem;
        }
        .btn-pill-light:hover {
            background: #f1f3f5;
            color: #364fc7;
        }

        .page-title {
            color: #ffffff;
            text-align: center;
            font-weight: 700;
        }

        .empty-note {
            color: #e7ecff;
            text-align: center;
        }

        .shop-footer {
            background: #4263eb;
            margin-top: 3rem;
            padding: 2.5rem 0;
        }
        .shop-footer .container {
            max-width: 480px;
        }
        .footer-link-btn {
            display: flex;
            align-items: center;
            gap: .75rem;
            background: rgba(255, 255, 255, .12);
            color: #ffffff;
            border-radius: 40px;
            padding: .75rem 1.25rem;
            margin-bottom: .9rem;
            text-decoration: none;
            font-weight: 600;
            transition: background .15s ease;
        }
        .footer-link-btn:hover {
            background: rgba(255, 255, 255, .22);
            color: #ffffff;
        }
        .footer-link-btn .icon {
            font-size: 1.2rem;
            width: 1.5rem;
            text-align: center;
        }

        .footer-link-btn.ozon {
            background: #ffffff;
            color: #031e8a;
        }
        .footer-link-btn.ozon:hover {
            background: #f1f3f5;
            color: #031e8a;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-shop mb-4 pt-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="/">Магазин</a>
            <a href="/cart" class="btn btn-pill-light">🛒 Корзина</a>
        </div>
    </nav>

    <div class="container">
        <h1 class="mb-4 page-title">Каталог товаров</h1>

        <div class="row">
            {{if .Products}}
                {{range .Products}}
                    {{template "product_card.html" (dict "Product" . "Counts" $.Counts)}}
                {{end}}
            {{else}}
                <p class="empty-note">Товары не найдены.</p>
            {{end}}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <footer class="shop-footer">
        <div class="container">
            <a href="https://www.ozon.ru/seller/izdatelstvo-shmel-428801" class="footer-link-btn ozon" target="_blank" rel="noopener">
                <span class="icon">🛍️</span> Купить на OZON
            </a>
            <a href="https://wa.me/79624037100" class="footer-link-btn" target="_blank" rel="noopener">
                <span class="icon">✏️</span> Написать
            </a>
            <a href="tel:+79624037100" class="footer-link-btn">
                <span class="icon">📞</span> Позвонить
            </a>
            <a href="https://t.me/shmell_publish" class="footer-link-btn" target="_blank" rel="noopener">
                <span class="icon">✈️</span> Подписаться в Telegram
            </a>
            <a href="https://instagram.com/shmell_publish/" class="footer-link-btn" target="_blank" rel="noopener">
                <span class="icon">📷</span> Подписаться в Instagram
            </a>
        </div>
    </footer>
</body>
</html>
