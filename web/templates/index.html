<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/common.css" rel="stylesheet">
    <link href="/static/catalog.css" rel="stylesheet">
</head>
<body>

    <section class="catalog-hero" aria-labelledby="catalog-hero-title">
        {{template "header.html"}}
        <img src="/image/static/landscape.jpg" alt="Пейзаж Ставропольского края">
        <div class="catalog-hero__shade">
            <h1 id="catalog-hero-title">Подарочное издание<br>о Ставропольском крае</h1>
        </div>
    </section>

    <div class="container">
        <h2 class="mb-4 page-title">Каталог товаров</h2>

        <div class="row">
            {{if .Products}}
                {{range .Products}}
                    {{template "product_card.html" (dict "Product" . "Counts" $.Counts "Return" $.ReturnPath)}}
                {{end}}
            {{else}}
                <p class="empty-note">Товары не найдены.</p>
            {{end}}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {{template "footer.html"}}
</body>
</html>
