<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/common.css" rel="stylesheet">
    <link href="/static/product.css" rel="stylesheet">
    <link href="/static/catalog.css" rel="stylesheet">
</head>
<body>
    <main class="catalog-page">
        <section class="catalog-hero" aria-labelledby="catalog-hero-title">
            <video class="catalog-hero__video" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
                <source src="/video/45.mp4" type="video/mp4">
            </video>
            <div class="catalog-hero__shade">
             
            </div>
            <div class="position-relative z-2">
                {{template "header.html"}}
            </div>
        </section>

        <div class="container">
            <div class="row">
                {{if .Products}}
                    {{range .Products}}
                        {{template "product_card.html" (dict "Product" . "Counts" $.Counts "Return" $.ReturnPath)}}
                    {{end}}
                {{else}}
                    <p class="empty-note">Товары не найдены.</p>
                {{end}}
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {{template "footer.html"}}
</body>
</html>
